name: Build & Release Windows (MSI + Portable + SHA256)

on:
  # Trigger automatically when you push a version tag like v1.0.0
  push:
    tags:
      - "v*"
  # Also allow clicking "Run workflow" manually in the GitHub Actions tab at any time!
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MSI, Setup & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri application (MSI + NSIS + EXE)
        working-directory: src-tauri
        run: cargo tauri build

      - name: Assemble Release Artifacts (MSI, Setup, Portable ZIP, SHA256SUMS.txt)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distDir = "release_Output"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          # 1. Copy MSI installer
          Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path $distDir $_.Name) -Force
          }

          # 2. Copy NSIS Setup (.exe) installer
          Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path $distDir $_.Name) -Force
          }

          # 3. Create Portable folder & ZIP (PixoDossiers.exe + payload/)
          $portableDir = "portable_stage\PixoDossiers_Portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri\target\release\pixo-dossiers.exe" -Destination (Join-Path $portableDir "PixoDossiers.exe") -Force
          Copy-Item "payload" -Destination (Join-Path $portableDir "payload") -Recurse -Force

          $zipPath = Join-Path $distDir "PixoDossiers_Windows_x64_Portable.zip"
          Compress-Archive -Path "$portableDir\*" -DestinationPath $zipPath -Force

          # 4. Also copy standalone PixoDossiers.exe
          Copy-Item "src-tauri\target\release\pixo-dossiers.exe" -Destination (Join-Path $distDir "PixoDossiers_Standalone.exe") -Force

          # 5. Generate SHA256SUMS.txt for all produced files
          $hashLines = @()
          Get-ChildItem $distDir -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $hashLines += "$h  $($_.Name)"
          }
          $hashLines | Set-Content -Path (Join-Path $distDir "SHA256SUMS.txt") -Encoding UTF8

          Write-Host "=== Generated Release Files & SHA-256 Checksums ==="
          Get-Content (Join-Path $distDir "SHA256SUMS.txt")

      - name: Upload Build Artifacts (Downloadable from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: PixoDossiers-Windows-x64-Release
          path: release_Output/*
          if-no-files-found: error

      - name: Publish GitHub Release (when triggered by a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_Output/*
          generate_release_notes: true
          body: |
            ## 🤖 Pixo et les Dossiers — Windows 10 / 11 (64-bit)

            ### 📦 Fichiers disponibles au téléchargement :
            - **Installateur MSI (`*.msi`)** : installation standard sous Windows.
            - **Installateur Setup (`*-setup.exe`)** : installateur rapide en un clic.
            - **Version Portable (`PixoDossiers_Windows_x64_Portable.zip`)** : **sans installation** (idéal pour les PC d'école sans droits administrateur : décompressez le dossier ZIP et double-cliquez sur `PixoDossiers.exe`).
            - **Empreintes de sécurité (`SHA256SUMS.txt`)** : sommes de contrôle SHA-256 de tous les fichiers.
